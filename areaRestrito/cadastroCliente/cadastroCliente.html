  <!--================== CADASTROU CLIENTE ==================-->
  <hr>

  <section>
    <div class="container">
      <div class="linha-topo">
        <h2><b>Cadastro Clientes</b></h2>
      </div>
      <div class="botaoIncluir">
        <!-- Mover o botão para fora do thead -->
        <button type="button" onclick="abrirModal('modalCadastroCliente')">Incluir</button>
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome</th>
              <th>CFP/CNPJ</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaClientes"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ================================================================= -->

  <div id="modalCadastroCliente" class="modal">
    <div class="modal-conteudo">
      <span class="fechar" onclick="fecharModal('modalCadastroCliente')">&times;</span>
      <h3>Incluir Cliente</h3>
      <form id="formCadastroCliente" method="get" action=".">
        <div class="row g-3">
          <div class="col-md-2">
            <label for="codigo">Código:</label>
            <input type="text" id="codigo" name="codigo" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label for="pfjr">Status</label>
            <select name="status" id="status" name="status" class="form-control">
              <option value="A">Ativo</option>
              <option value="I">Inativo</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="nome">Data Cadastro</label>
            <input type="date" id="dataCadastro" name="dataCadastro" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label for="pfjr">Física/Jurídica</label>
            <select name="pfjr" id="pfjr" class="form-control" onchange="alternarTipoPessoa()">
              <option value="F">Física</option>
              <option value="J">Jurídica</option>
            </select>
          </div>
          <div class="col-md-2">
            <!-- Campo CPF -->
            <div id="cpfDiv">
              <label for="CPF">CPF</label>
              <input type="text" id="cpf" name="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00">
            </div>
            <!-- Campo CNPJ -->
            <div id="cnpjDiv" style="display: none;">
              <label for="CNPJ">CNPJ</label>
              <input type="text" id="cnpj" name="cnpj" class="form-control" maxlength="18"
                placeholder="00.000.000/0000-00">
            </div>
          </div>
          <div class="col-md-2">
            <label for="cep">Cep:</label>
            <input type="text" id="cep" name="cep" class="form-control" value="" size="10" maxlength="10"
              placeholder="00.000-000" required onblur="pesquisacep(this.value);">
          </div>
          <div class="col-md-4">
            <label for="logradouro">Endereço:</label>
            <input type="text" id="logradouro" name="logradouro" class="form-control" maxlength="150" required>
          </div>
          <div class="col-md-2">
            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" class="form-control" maxlength="20" required>
          </div>
          <div class="col-md-2">
            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento" name="complemento" class="form-control" maxlength="50">
          </div>
          <div class="col-md-3">
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" class="form-control" maxlength="50" required>
          </div>
          <div class="col-md-3">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" class="form-control" maxlength="50" required>
          </div>
          <div class="col-md-2">
            <label for="estado">Estado</label>
            <select name="estado" id="estado" class="form-control" class="form-control" required>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="pfjr">Cliente/Prospect</label>
            <select name="clienteProspect" id="clienteProspect" class="form-control">
              <option value="C">Cliente</option>
              <option value="P">Prospect</option>
            </select>
          </div>
        </div>
        <button type="submit">Salvar</button>
        <button type="button" onclick="fecharModal('modalCadastroCliente')">Cancelar</button>
      </form>
    </div>
  </div>
