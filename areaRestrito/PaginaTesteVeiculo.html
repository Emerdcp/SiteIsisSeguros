<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ÍSIS Seguros</title>
  <link rel="icon" href="../imagens/isis.png" type="image/png">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="styleRestrito.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <meta name="description" content="Isis Seguros oferece proteção patrimonial, familiar e profissional com soluções personalizadas para pessoas físicas e empresas. Contamos com profissionais qualificados e parcerias com as melhores seguradoras do mercado para garantir agilidade e excelência nos serviços prestados."/>
</head>

<button onclick="abrirModal()">Incluir</button>

<table border="1">
  <thead>
    <tr>
      <th>Código</th>
      <th>Descrição</th>
      <th>Modelo</th>
    </tr>
  </thead>
  <tbody id="tabelaVeiculos"></tbody>
</table>

<div id="modalCadastro" class="modal">
  <div class="modal-conteudo">
    <span onclick="fecharModal()" style="cursor:pointer;">&times;</span>
    <h3>Incluir Veículo</h3>
    <form id="formCadastro">
      <label>Código:</label><input type="text" id="codigo"><br>
      <label>Descrição:</label><input type="text" id="descricao"><br>
      <label>Modelo:</label><input type="text" id="modelo"><br><br>
      <button type="submit">Salvar</button>
    </form>
  </div>
</div>

<script>
  function abrirModal() {
    document.getElementById("modalCadastro").style.display = "block";
  }

  function fecharModal() {
    document.getElementById("modalCadastro").style.display = "none";
  }

  document.getElementById("formCadastro").addEventListener("submit", function(e) {
    e.preventDefault();
    const codigo = document.getElementById("codigo").value.trim();
    const descricao = document.getElementById("descricao").value.trim();
    const modelo = document.getElementById("modelo").value.trim();

    console.log("Capturado:", codigo, descricao, modelo); // Teste

    const novaLinha = document.createElement("tr");
    novaLinha.innerHTML = `
      <td>${codigo}</td>
      <td>${descricao}</td>
      <td>${modelo}</td>
    `;

    document.getElementById("tabelaVeiculos").appendChild(novaLinha);
    this.reset();
    fecharModal();
  });
</script>

    defer></script>
</body>
</html>
